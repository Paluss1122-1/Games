<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dinosaurier-Spiel</title>
    <link rel="icon" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0e0e0e;
            --bg-card: #1a1a1a;
            --bg-hover: #242424;
            --border: #2a2a2a;
            --text-dim: #555;
            --text-mid: #999;
            --text-main: #e2e2e2;
            --text-white: #f5f5f5;
            --accent: #e04848;
        }

        html,
        body {
            background: var(--bg-deep);
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0;
        }

        /* grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
        }

        /* ─── GAME PAGE HEADER ─── */
        .game-header {
            width: 100%;
            max-width: 860px;
            padding: 40px 24px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .game-header .label-top {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .game-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .game-header h1 .dot {
            color: var(--accent);
        }

        .game-header .header-rule {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 16px 0 0;
        }

        /* ─── STATS BAR ─── */
        .stats-bar {
            width: 100%;
            max-width: 860px;
            display: flex;
            gap: 1px;
            background: var(--border);
            margin-top: 16px;
        }

        .stat-block {
            flex: 1;
            background: var(--bg-card);
            padding: 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-block .stat-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .stat-block .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-white);
        }

        /* ─── CANVAS WRAPPER ─── */
        .canvas-wrap {
            width: 100%;
            max-width: 860px;
            margin-top: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ─── MESSAGE / HINT ─── */
        .msg-bar {
            width: 100%;
            max-width: 860px;
            margin-top: 1px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            font-size: 0.82rem;
            color: var(--text-mid);
            font-family: 'Inter', sans-serif;
            min-height: 42px;
            display: flex;
            align-items: center;
        }

        /* ─── CONTROLS ROW ─── */
        .ctrl-row {
            width: 100%;
            max-width: 860px;
            display: flex;
            gap: 1px;
            background: var(--border);
            margin-top: 16px;
        }

        .ctrl-btn {
            flex: 1;
            background: var(--bg-card);
            border: none;
            color: var(--text-main);
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 14px 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .ctrl-btn:hover {
            background: var(--bg-hover);
            color: var(--text-white);
        }

        .ctrl-btn.primary {
            background: var(--accent);
            color: #fff;
        }

        .ctrl-btn.primary:hover {
            background: #c93a3a;
            color: #fff;
        }

        /* ─── BACK LINK ─── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 28px 0 40px;
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ─── OVERLAY (start / game-over screens) ─── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.92);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 24px;
        }

        .overlay .overlay-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .overlay h2 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.02em;
            text-align: center;
            line-height: 1.1;
        }

        .overlay h2 .dot {
            color: var(--accent);
        }

        .overlay .overlay-rule {
            width: 60px;
            height: 1px;
            background: var(--border);
        }

        .overlay p {
            font-size: 0.9rem;
            color: var(--text-mid);
            text-align: center;
            max-width: 420px;
            line-height: 1.6;
        }

        .overlay .overlay-scores {
            display: flex;
            gap: 32px;
        }

        .overlay .ov-score {
            text-align: center;
        }

        .overlay .ov-score .ov-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .overlay .ov-score .ov-val {
            font-family: 'Space Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-white);
        }

        .overlay .ov-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 13px 32px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .overlay .ov-btn:hover {
            background: #c93a3a;
        }

        /* ─── DIFFICULTY PILLS (breakout) ─── */
        .diff-row {
            display: flex;
            gap: 1px;
            background: var(--border);
            margin-top: 12px;
        }

        .diff-pill {
            background: var(--bg-card);
            border: none;
            color: var(--text-mid);
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 10px 18px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .diff-pill:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .diff-pill.active {
            background: var(--accent);
            color: #fff;
        }

        /* ─── MOBILE D-PAD (snake) ─── */
        .dpad {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 16px;
        }

        .dpad-row {
            display: flex;
            gap: 2px;
        }

        .dpad-btn {
            width: 56px;
            height: 56px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .dpad-btn:active {
            background: var(--accent);
            color: #fff;
        }

        @media (max-width: 600px) {
            .dpad {
                display: flex;
            }

            .game-header {
                padding-top: 24px;
            }
        }

        /* ─── RESPONSIVE canvas height ─── */
        .canvas-wrap {
            min-height: 280px;
        }

        @media (min-width: 601px) {
            .canvas-wrap {
                min-height: 420px;
            }
        }

        /* new-highscore flash */
        #newHighscoreAlert {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 10px 24px;
            z-index: 200;
            display: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-family: Arial, sans-serif;
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
        }
    </style>
</head>

<body>
    <div class="game-header">
        <h1>DINOSAURIER</h1>
        <div class="header-rule"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-block">
            <span class="stat-label">Punkte</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-block">
            <span class="stat-label">Highscore</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
    </div>

    <div class="canvas-wrap">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="msg-bar" id="message">Drücke Leertaste zum Springen</div>

    <div class="ctrl-row">
        <button class="ctrl-btn primary" onclick="startGame()">Neues Spiel</button>
    </div>


    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="overlay" id="gameOver">
        <p class="overlay-label">Ende</p>
        <h2>GAME OVER</h2>
        <div class="overlay-rule"></div>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Punkte</div>
                <div class="ov-val" id="finalScore">0</div>
            </div>
        </div>
        <button class="ov-btn" onclick="window.location.reload()">Nochmal</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('message');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');

        // Canvas-GrÃ¶ÃŸe anpassen
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Spielvariablen
        let score = 0;
        let highScore = localStorage.getItem('highScore_dinosaurier') || 0;
        let gameActive = false;
        let animationFrame;
        let gameSpeed = 0;
        let groundY = canvas.height - 20;

        let oncestarted = false

        // Dinosaurier
        const dino = {
            x: 50,
            y: groundY,
            width: 40,
            height: 60,
            jumping: false,
            jumpVelocity: 0,
            gravity: 0.6,
            jumpForce: -15,
            baseGravity: 0.6,
            baseJumpForce: -15
        };

        // Kaktus
        let cacti = [];
        const cactusWidth = 20;
        const cactusHeight = 40;
        const minCactusDistance = 500; // Mindestabstand zwischen Kakteen

        // Wolken
        let clouds = [];
        const cloudCount = 3;

        function drawDino() {
            // KÃ¶rper
            ctx.fillStyle = '#535353';
            ctx.fillRect(dino.x, dino.y - dino.height, dino.width, dino.height);

            // Auge
            ctx.fillStyle = 'white';
            ctx.fillRect(dino.x + 25, dino.y - dino.height + 15, 8, 8);

            // Pupille
            ctx.fillStyle = 'black';
            ctx.fillRect(dino.x + 28, dino.y - dino.height + 15, 4, 4);
        }

        function drawCacti() {
            ctx.fillStyle = '#535353';
            cacti.forEach(cactus => {
                ctx.fillRect(cactus.x, groundY - cactus.height, cactus.width, cactus.height);
            });
        }

        function drawClouds() {
            ctx.fillStyle = 'black';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, 15, 0, Math.PI * 2);
                ctx.arc(cloud.x + 10, cloud.y, 15, 0, Math.PI * 2);
                ctx.arc(cloud.x + 20, cloud.y, 15, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGround() {
            ctx.fillStyle = '#535353';
            ctx.fillRect(0, groundY, canvas.width, 2);
        }

        function updateDino() {
            if (dino.jumping) {
                dino.jumpVelocity += dino.gravity;
                dino.y += dino.jumpVelocity;

                if (dino.y >= groundY) {
                    dino.y = groundY;
                    dino.jumping = false;
                    dino.jumpVelocity = 0;
                }
            }
        }

        function createCactus() {
            if (Math.random() < 0.015) {
                // Prüfe, ob der letzte Kaktus weit genug entfernt ist
                if (cacti.length === 0 ||
                    (canvas.width - cacti[cacti.length - 1].x) > minCactusDistance) {
                    cacti.push({
                        x: canvas.width,
                        width: cactusWidth,
                        height: cactusHeight
                    });
                }
            }
        }

        function updateCacti() {
            cacti = cacti.filter(cactus => {
                cactus.x -= gameSpeed;
                return cactus.x > -cactus.width;
            });
        }

        function createClouds() {
            if (clouds.length < cloudCount && Math.random() < 0.02) {
                clouds.push({
                    x: canvas.width + 30,
                    y: Math.random() * (groundY - 50) + 30
                });
            }
        }

        function updateClouds() {
            clouds = clouds.filter(cloud => {
                cloud.x -= gameSpeed / 2;
                return cloud.x > -30;
            });
        }

        function checkCollision() {
            return cacti.some(cactus => {
                return dino.x < cactus.x + cactus.width &&
                    dino.x + dino.width > cactus.x &&
                    dino.y - dino.height < groundY &&
                    dino.y > groundY - cactus.height;
            });
        }

        function updateScore() {
            score++;
            scoreElement.textContent = score;

            if (score % 200 === 0) {
                gameSpeed += 0.3;
                // Passe Jump-Physik an die Geschwindigkeit an
                const speedMultiplier = gameSpeed / 4; // 4 ist die Startgeschwindigkeit
                dino.gravity = dino.baseGravity * speedMultiplier;
                dino.jumpForce = dino.baseJumpForce * speedMultiplier;
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zeichne und aktualisiere alle Elemente
            drawGround();
            drawClouds();
            updateClouds();
            createClouds();

            drawCacti();
            updateCacti();
            createCactus();

            updateDino();
            drawDino();

            // Kollisionserkennung
            if (checkCollision()) {
                endGame();
                return;
            }

            // Score aktualisieren
            updateScore();

            animationFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameActive) return;
            if (oncestarted) return;

            oncestarted = true
            score = 0;
            scoreElement.textContent = score;
            gameSpeed = 4;
            cacti = [];
            clouds = [];
            dino.y = groundY;
            dino.jumping = false;
            dino.jumpVelocity = 0;
            // Setze Jump-Physik zurück
            dino.gravity = dino.baseGravity;
            dino.jumpForce = dino.baseJumpForce;
            gameActive = true;
            message.textContent = isMobileDevice() ? "Tippe um zu springen" : "Drücke Leertaste zum Springen";
            gameLoop();
            document.querySelectorAll('[onclick="startGame()"]').forEach(obj => {
                obj.style.display = "none";
            });
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationFrame);
            document.getElementById("finalScore").innerText = score
            document.getElementById("gameOver").style.display = "flex"

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore_dinosaurier', highScore);
                highScoreElement.textContent = highScore;
            }
        }

        // PrÃ¼fe, ob es sich um ein mobiles GerÃ¤t handelt
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Initialisiere die Nachricht basierend auf dem GerÃ¤tetyp
        document.addEventListener('DOMContentLoaded', function () {
            message.textContent = isMobileDevice() ? "Tippe um zu springen" : "Drücke Leertaste zum Springen";
        });

        let jumpedonce = false

        // Steuerung
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameActive) {
                    startGame();
                } else if (!dino.jumping) {
                    dino.jumping = true;
                    dino.jumpVelocity = dino.jumpForce;
                }
                e.preventDefault();
                if (jumpedonce !== true) {
                    document.getElementById("message").innerText = "   "
                    jumpedonce = true
                }
            }
        });

        // Touch-Steuerung fÃ¼r mobile GerÃ¤te
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) {
                startGame();
            } else if (!dino.jumping) {
                dino.jumping = true;
                dino.jumpVelocity = dino.jumpForce;
            }
            e.preventDefault();
                if (jumpedonce !== true) {
                    document.getElementById("message").innerText = "   "
                    jumpedonce = true
                }
        }, { passive: false });

        // Initialisiere Highscore
        highScoreElement.textContent = highScore;
    </script>
</body>

</html>
