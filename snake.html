<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
</head>

<body>
    <div class="game-header">
        <h1>SNAKE</h1>
        <div class="header-rule"></div>
    </div>

    <div class="stats-bar" id="statsbar">
        <div class="stat-block">
            <span class="stat-label">Punkte</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-block">
            <span class="stat-label">Highscore</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
    </div>

    <div class="canvas-wrap" id="canvaswrap">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="msg-bar" id="message">Drücke eine Pfeiltaste zum Starten</div>

    <div class="overlay" id="startScreen">
        <p class="overlay-label">Snake</p>
        <h2>BEREIT</h2>
        <div class="overlay-rule"></div>
        <p id="desktopInstructions">Steuerung: Pfeiltasten links / rechts</p>
        <p id="mobileInstructions">Steuerung: Benutze die Buttons zum Steuern</p>
        <div class="overlay-rule"></div>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Highscore</div>
                <div class="ov-val" id="final-Score">0</div>
            </div>
        </div>
        <div class="overlay-rule"></div>
        <button class="ov-btn" id="startButton"
            onclick="startGame(); this.parentElement.style.display = 'none'">Starten</button>
    </div>

    <!-- D-Pad for mobile -->
    <div class="dpad">
        <div class="dpad-row">
            <button class="dpad-btn" id="upButton">▲</button>
        </div>
        <div class="dpad-row">
            <button class="dpad-btn" id="leftButton">◀</button>
            <button class="dpad-btn" id="downButton">▼</button>
            <button class="dpad-btn" id="rightButton">▶</button>
        </div>
    </div>


    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="overlay" id="gameOver">
        <p class="overlay-label">Ende</p>
        <h2>GAME OVER</h2>
        <div class="overlay-rule"></div>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Punkte</div>
                <div class="ov-val" id="finalScore">0</div>
            </div>
        </div>
        <button class="ov-btn" onclick="window.location.reload()">Nochmal</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('message');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');

        // Canvas-GrÃ¶ÃŸe anpassen
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Spielvariablen
        let score = 0;
        let highScore = localStorage.getItem('highScore_snake') || 0;
        document.getElementById("final-Score").textContent = highScore
        let gameActive = false;
        let animationFrame;
        const gridSize = 20;
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameSpeed = 100;

        let oncestarted = false

        // Initialisiere die Schlange
        function initSnake() {
            snake = [
                { x: 5, y: 5 },
                { x: 4, y: 5 },
                { x: 3, y: 5 }
            ];
        }

        // Erzeuge neues Futter
        function createFood() {
            const maxX = Math.floor(canvas.width / gridSize) - 1;
            const maxY = Math.floor(canvas.height / gridSize) - 1;

            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * maxX),
                    y: Math.floor(Math.random() * maxY)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));

            food = newFood;
        }

        function drawSnake() {
            ctx.fillStyle = '#6c5ce7';
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00cec9';
                } else {
                    ctx.fillStyle = '#6c5ce7';
                }
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
            });
        }

        function drawFood() {
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
        }

        function moveSnake() {
            const head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Kollision mit WÃ¤nden
            if (head.x < 0 || head.x >= canvas.width / gridSize ||
                head.y < 0 || head.y >= canvas.height / gridSize) {
                endGame();
                return;
            }

            // Kollision mit sich selbst
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Futter gefressen?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                createFood();

                // Erhöhe Geschwindigkeit alle 50 Punkte
                if (score % 50 === 0) {
                    gameSpeed = Math.max(50, gameSpeed - 5);
                }
            } else {
                snake.pop();
            }

            direction = nextDirection;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moveSnake();
            drawSnake();
            drawFood();

            setTimeout(() => {
                animationFrame = requestAnimationFrame(gameLoop);
            }, gameSpeed);
        }

        function startGame() {
            if (gameActive) return;
            if (oncestarted) return;

            document.getElementById("statsbar").style.opacity = 1
            document.getElementById("canvaswrap").style.opacity = 1
            document.getElementById("message").style.opacity = 1

            oncestarted = true
            score = 0;
            scoreElement.textContent = score;
            gameSpeed = 100;
            direction = 'right';
            nextDirection = 'right';
            initSnake();
            createFood();
            gameActive = true;
            message.textContent = isMobileDevice() ? "Benutze die Buttons zum Steuern" : `Steuerung: Pfeiltasten links / rechts`;
            gameLoop();
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationFrame);
            document.getElementById("finalScore").innerText = score
            document.getElementById("gameOver").style.display = "flex"

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore_snake', highScore);
                highScoreElement.textContent = highScore;
            }

            document.getElementById("statsbar").style.opacity = 0
            document.getElementById("canvaswrap").style.opacity = 0
            document.getElementById("message").style.opacity = 0
        }

        // PrÃ¼fe, ob es sich um ein mobiles GerÃ¤t handelt
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Tastatursteuerung
        document.addEventListener('keydown', (e) => {
            if (!gameActive && (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                startGame();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
            }
        });

        // Mobile Steuerung
        document.getElementById('upButton').addEventListener('touchstart', () => {
            if (!gameActive) {
                startGame();
            }
            if (direction !== 'down') nextDirection = 'up';
        });
        document.getElementById('downButton').addEventListener('touchstart', () => {
            if (!gameActive) {
                startGame();
            }
            if (direction !== 'up') nextDirection = 'down';
        });
        document.getElementById('leftButton').addEventListener('touchstart', () => {
            if (!gameActive) {
                startGame();
            }
            if (direction !== 'right') nextDirection = 'left';
        });
        document.getElementById('rightButton').addEventListener('touchstart', () => {
            if (!gameActive) {
                startGame();
            }
            if (direction !== 'left') nextDirection = 'right';
        });

        // Initialisiere Highscore
        highScoreElement.textContent = highScore;
    </script>
</body>

</html>
