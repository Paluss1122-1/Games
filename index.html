<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="favicon.svg">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0e0e0e;
            --bg-card: #1a1a1a;
            --bg-hover: #242424;
            --border: #2a2a2a;
            --text-dim: #555;
            --text-mid: #999;
            --text-main: #e2e2e2;
            --text-white: #f5f5f5;
            --accent: #fff;
            --red: #e04848;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* subtle grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
        }

        /* ─── HEADER ─── */
        header {
            width: 100%;
            max-width: 960px;
            padding: 56px 24px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .label-top {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2.6rem, 7vw, 4.2rem);
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        h1 .accent-dot {
            color: var(--red);
        }

        .header-rule {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 28px 0 0;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-top: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
        }

        /* ─── GRID ─── */
        .games-container {
            width: 100%;
            max-width: 960px;
            padding: 36px 24px 24px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
        }

        /* ─── CARD ─── */
        .game-link {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 24px 22px;
            background: var(--bg-card);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            transition: background 0.25s ease;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn 0.45s cubic-bezier(.22, .68, 0, 1.2) forwards;
        }

        .game-link:nth-child(1) {
            animation-delay: 0.05s;
        }

        .game-link:nth-child(2) {
            animation-delay: 0.10s;
        }

        .game-link:nth-child(3) {
            animation-delay: 0.15s;
        }

        .game-link:nth-child(4) {
            animation-delay: 0.20s;
        }

        .game-link:nth-child(5) {
            animation-delay: 0.25s;
        }

        .game-link:nth-child(6) {
            animation-delay: 0.30s;
        }

        .game-link:nth-child(7) {
            animation-delay: 0.35s;
        }

        .game-link:nth-child(8) {
            animation-delay: 0.40s;
        }

        .game-link:nth-child(9) {
            animation-delay: 0.45s;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-link:hover {
            background: var(--bg-hover);
        }

        /* index number — top left */
        .card-index {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            transition: color 0.25s;
        }

        .game-link:hover .card-index {
            color: var(--red);
        }

        /* title row — bottom */
        .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.01em;
            transition: color 0.25s;
        }

        .game-link:hover .card-title {
            color: var(--text-white);
        }

        /* arrow icon */
        .card-arrow {
            width: 20px;
            height: 20px;
            opacity: 0;
            transform: translate(-4px, 4px);
            transition: opacity 0.25s, transform 0.25s cubic-bezier(.22, .68, 0, 1.2);
        }

        .game-link:hover .card-arrow {
            opacity: 1;
            transform: translate(0, 0);
        }

        .card-arrow svg {
            width: 100%;
            height: 100%;
            stroke: var(--text-white);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ─── FOOTER ─── */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(to top, var(--bg-deep) 60%, transparent);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 700px) {
            .games-container {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                padding-top: 40px;
            }
        }

        @media (max-width: 420px) {
            .games-container {
                grid-template-columns: 1fr;
            }

            .game-link {
                min-height: 100px;
            }

            header {
                padding-top: 32px;
            }
        }
    </style>
</head>
