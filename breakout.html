<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <link rel="icon" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .diff-row {
            display: flex;
            gap: 1px;
            background: var(--border);
            margin-top: 12px;
        }

        .diff-pill {
            background: var(--bg-card);
            border: none;
            color: var(--text-mid);
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 10px 18px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.2s;
            transform: translate(100%, -50%);
            z-index: 100;
        }

        .diff-pill:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .diff-pill.active {
            background: var(--accent);
            color: #fff;
        }

        #successMessage {
            display: none;
        }

        #successMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            display: none;
            height: 90%;
            max-height: 400px;
        }

        .success-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 6px 14px;
            color: #fff;
        }

        .success-badge.easy {
            background: #00b894;
        }

        .success-badge.medium {
            background: #fdcb6e;
            color: #2d3436;
        }

        .success-badge.hard {
            background: #e04848;
        }
    </style>
</head>

<body>
    <div class="game-header">
        <h1>BREAKOUT</h1>
        <div class="header-rule"></div>
    </div>

    <div class="stats-bar" id="statsbar">
        <div class="stat-block">
            <span class="stat-label">Punkte</span>
            <span class="stat-value" id="score">Punkte: 0</span>
        </div>
        <div class="stat-block">
            <span class="stat-label">Highscore</span>
            <span class="stat-value" id="highscore">Highscore: 0</span>
        </div>
    </div>

    <div class="canvas-wrap" id="canvaswrap">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <div class="overlay" id="startScreen">
        <p class="overlay-label">Breakout</p>
        <h2>BEREIT</h2>
        <div class="overlay-rule"></div>
        <p id="desktopInstructions" style="display:none;">Steuerung: Pfeiltasten links / rechts<br>Ziel: Zerstöre alle
            Blöcke!</p>
        <p id="mobileInstructions" style="display:none;">Steuerung: Berühre und ziehe das Paddle<br>Ziel: Zerstöre alle
            Blöcke!</p>
        <div class="diff-row">
            <button class="diff-pill active" data-difficulty="easy"
                onclick="Array.from(document.getElementsByClassName('diff-pill')).forEach(obj => {obj.className = 'diff-pill';}); this.className = 'diff-pill active'; currentDifficulty = 'easy'">Leicht
                <div class="arrow" id="ae">✅</div>
            </button>
            <button class="diff-pill" data-difficulty="medium"
                onclick="Array.from(document.getElementsByClassName('diff-pill')).forEach(obj => {obj.className = 'diff-pill';}); this.className = 'diff-pill active'; currentDifficulty = 'medium'">Mittel
                <div class="arrow" id="am">✅</div>
            </button>
            <button class="diff-pill" data-difficulty="hard"
                onclick="Array.from(document.getElementsByClassName('diff-pill')).forEach(obj => {obj.className = 'diff-pill';}); this.className = 'diff-pill active'; currentDifficulty = 'hard'">Schwer
                <div class="arrow" id="ad">✅</div>
            </button>
        </div>
        <button class="ov-btn" id="startButton">Starten</button>
    </div>

    <!-- GAME OVER overlay -->
    <div class="overlay" id="gameOver">
        <p class="overlay-label">Ende</p>
        <h2>GAME OVER</h2>
        <div class="overlay-rule"></div>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Punkte</div>
                <div class="ov-val" id="finalScore">0</div>
            </div>
        </div>
        <button class="ov-btn" id="restartButton">Nochmal</button>
    </div>

    <!-- SUCCESS overlay -->
    <div class="overlay" id="successMessage">
        <p class="overlay-label">Gewonnen</p>
        <h2>NICE<span class="dot">!</span></h2>
        <div class="overlay-rule"></div>
        <span class="success-badge easy" id="successDifficultyBadge">Leicht</span>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Highscore</div>
                <div class="ov-val" id="successHighscore">0</div>
            </div>
        </div>
        <button class="ov-btn" id="successRestartButton">Nochmal spielen</button>
    </div>


    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Zurück zur Startseite
    </a>


    <script>
        let gameActive = false;
        window.currentDifficulty = 'easy';
        const difficultySettings = {
            easy: { paddleWidth: 250 },
            medium: { paddleWidth: 150 },
            hard: { paddleWidth: 100 }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highscoreElement = document.getElementById('highscore');
        const gameOverElement = document.getElementById('gameOver');
        const successMessageElement = document.getElementById('successMessage');
        const startScreenElement = document.getElementById('startScreen');
        const difficultySwitchElement = document.querySelector('.difficulty-switch');
        const finalScoreElement = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const successRestartButton = document.getElementById('successRestartButton');
        const startButton = document.getElementById('startButton');
        const difficultyOptions = document.querySelectorAll('.difficulty-option');

        // LocalStorage initialisieren
        if (!localStorage.getItem('highscore_breakout_easy')) {
            localStorage.setItem('highscore_breakout_easy', '0');
        }
        if (!localStorage.getItem('highscore_breakout_medium')) {
            localStorage.setItem('highscore_breakout_medium', '0');
        }
        if (!localStorage.getItem('highscore_breakout_hard')) {
            localStorage.setItem('highscore_breakout_hard', '0');
        }
        if (!localStorage.getItem('breakoutCompleted_easy')) {
            localStorage.setItem('breakoutCompleted_easy', 'false');
        }
        if (!localStorage.getItem('breakoutCompleted_medium')) {
            localStorage.setItem('breakoutCompleted_medium', 'false');
        }
        if (!localStorage.getItem('breakoutCompleted_hard')) {
            localStorage.setItem('breakoutCompleted_hard', 'false');
        }

        // Highscore laden und anzeigen
        function updateHighscoreDisplay() {
            const currentHighscore = parseInt(localStorage.getItem(`highscore_breakout_${currentDifficulty}`));
            const difficultyNames = {
                easy: 'Leicht',
                medium: 'Mittel',
                hard: 'Schwer'
            };
            highscoreElement.textContent = `Highscore (${difficultyNames[currentDifficulty]}): ${currentHighscore}`;
        }
        updateHighscoreDisplay();

        // Erfolgsmeldung oder Startbildschirm anzeigen
        function checkAndShowSuccess() {
            const easyCompleted = localStorage.getItem('breakoutCompleted_easy') === 'true';
            const mediumCompleted = localStorage.getItem('breakoutCompleted_medium') === 'true';
            const hardCompleted = localStorage.getItem('breakoutCompleted_hard') === 'true';

            if (easyCompleted) {
                document.getElementById("ae").style.opacity = "1"
            }
            if (mediumCompleted) {
                document.getElementById("am").style.opacity = "1"
            }
            if (hardCompleted) {
                document.getElementById("ad").style.opacity = "1"
            }
        }
        checkAndShowSuccess();

        // Spielvariablen
        let score = 0;
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 30;
        const maxScore = brickRowCount * brickColumnCount;

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 10,
            dx: 4,
            dy: -4
        };

        // Paddle
        const paddle = {
            width: difficultySettings[currentDifficulty].paddleWidth,
            height: 20,
            x: (canvas.width - difficultySettings[currentDifficulty].paddleWidth) / 2,
            y: canvas.height - 50
        };

        // BlÃ¶cke
        const bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // Steuerung
        let rightPressed = false;
        let leftPressed = false;
        let touchStartX = 0;
        let touchOffset = 0;

        document.addEventListener('keydown', keyDownHandler);
        document.addEventListener('keyup', keyUpHandler);
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', restartGame);
        successRestartButton.addEventListener('click', restartGame);

        // Touch Events
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', handleTouchEnd);

        // Touch-GerÃ¤t Erkennung
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        document.getElementById(isTouchDevice ? 'mobileInstructions' : 'desktopInstructions').style.display = 'block';

        // Schwierigkeitsgrad Event Listener
        difficultyOptions.forEach(option => {
            option.addEventListener('click', () => {
                difficultyOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                currentDifficulty = option.dataset.difficulty;
                updateHighscoreDisplay();
            });
        });

        function keyDownHandler(e) {
            if (!gameActive) return;
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = true;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (!gameActive) return;
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = false;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = false;
            }
        }

        function handleTouchStart(e) {
            if (!gameActive) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const touchX = (touch.clientX - rect.left) * scaleX;
            const touchY = (touch.clientY - rect.top) * scaleY;

            // Vereinfachte Touch-Logik: Akzeptiere jeden Touch im unteren Drittel
            if (touchY > canvas.height * 0.66) {
                touchStartX = touchX;
                touchOffset = touchX - paddle.x;
            }
        }

        function handleTouchMove(e) {
            if (!gameActive) return;
            e.preventDefault();
            if (touchStartX === 0) return;

            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const touchX = (touch.clientX - rect.left) * scaleX;

            // Paddle position berechnen
            let newPaddleX = touchX - touchOffset;

            // Paddle innerhalb des Canvas halten
            newPaddleX = Math.max(0, Math.min(canvas.width - paddle.width, newPaddleX));

            paddle.x = newPaddleX;
        }

        function handleTouchEnd(e) {
            if (!gameActive) return;
            e.preventDefault();
            touchStartX = 0;
            touchOffset = 0;
        }

        function startGame() {
            gameActive = true;
            startScreenElement.style.display = 'none';
            paddle.width = difficultySettings[currentDifficulty].paddleWidth;
            paddle.x = (canvas.width - paddle.width) / 2;

            document.getElementById("statsbar").style.opacity = 1
            document.getElementById("canvaswrap").style.opacity = 1

            // Randomisiere die Ballrichtung (zwischen -30° und +30°)
            const angle = (Math.random() * 60 - 30) * Math.PI / 180;
            const speed = 4;
            ball.dx = speed * Math.sin(angle);
            ball.dy = -speed * Math.cos(angle);

            draw();
        }

        function restartGame() {
            window.location.reload()
        }

        // Kollisionserkennung
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score++;
                            scoreElement.textContent = `Punkte: ${score}`;

                            // Highscore aktualisieren
                            const currentHighscore = parseInt(localStorage.getItem(`highscore_breakout_${currentDifficulty}`));
                            if (score > currentHighscore) {
                                localStorage.setItem(`highscore_breakout_${currentDifficulty}`, score.toString());
                                updateHighscoreDisplay();
                            }

                            // PrÃ¼fen ob alle BlÃ¶cke zerstÃ¶rt sind
                            if (score === maxScore) {
                                localStorage.setItem(`breakoutCompleted_${currentDifficulty}`, 'true');
                                gameActive = false;

                                const difficultyNames = {
                                    easy: 'Leicht',
                                    medium: 'Mittel',
                                    hard: 'Schwer'
                                };

                                document.getElementById('successDifficultyBadge').className = `success-badge ${currentDifficulty}`;
                                document.getElementById('successDifficultyBadge').textContent = difficultyNames[currentDifficulty];
                                document.getElementById('successHighscore').textContent = score;
                                successMessageElement.style.display = 'flex';
                            }
                        }
                    }
                }
            }
        }

        // Zeichnen des Balls
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();
        }

        // Zeichnen des Paddles
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();
        }

        // Zeichnen der Blöcke
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // Hauptspiellogik
        function draw() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Ballbewegung
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > paddle.y &&
                ball.y + ball.dy < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                // Game Over
                gameActive = false;
                finalScoreElement.textContent = score;
                gameOverElement.style.display = 'flex';
                return;
            }

            // Paddlebewegung
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += 7;
            } else if (leftPressed && paddle.x > 0) {
                paddle.x -= 7;
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>

</html>
