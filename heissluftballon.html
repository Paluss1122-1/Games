<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heißluftballon</title>
    <link rel="icon" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="overlay" id="startScreen">
        <p class="overlay-label">Heissluftballon</p>
        <h2>BEREIT</h2>
        <div class="overlay-rule"></div>
        <p id="desktopInstructions">Steuerung: Benutze die Maus zum Steuern</p>
        <p id="mobileInstructions">Steuerung: Ziehe den Ballon</p>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Highscore</div>
                <div class="ov-val" id="final-Score">0</div>
            </div>
        </div>
        <div class="overlay-rule"></div>
        <button class="ov-btn" id="startButton" onclick="startGame(); this.parentElement.style.display = 'none'">Starten</button>
    </div>

    <div class="game-header">
        <h1>HEISSLUFTBALLON</h1>
        <div class="header-rule"></div>
    </div>

    <div class="stats-bar" id="statsbar">
        <div class="stat-block">
            <span class="stat-label">Punkte</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-block">
            <span class="stat-label">Highscore</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
    </div>

    <div class="canvas-wrap" id="canvaswrap">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="msg-bar" id="message"></div>

    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="overlay" id="gameOver">
        <p class="overlay-label">Ende</p>
        <h2>GAME OVER</h2>
        <div class="overlay-rule"></div>
        <div class="overlay-scores">
            <div class="ov-score">
                <div class="ov-label">Punkte</div>
                <div class="ov-val" id="finalScore">0</div>
            </div>
        </div>
        <button class="ov-btn" onclick="window.location.reload()">Nochmal</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('message');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');

        // Spielvariablen
        let score = 0;
        let highScore = localStorage.getItem('highScore_heissluftballon') || 0;
        document.getElementById("final-Score").textContent = highScore
        let gameActive = false;
        let animationFrame;
        let touchX = 0;
        let isTouching = false;
        let mouseX = 0;
        let isMouseDown = false;
        let gameSpeed = 100;
        let direction = 'right';
        let nextDirection = 'right';

        let oncestarted = false

        // Ballon
        const balloon = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 50,
            height: 60,
            speed: 5,
            // Hitbox-Punkte für den Ballon
            hitbox: {
                top: { x: 0, y: -30 },
                right: { x: 25, y: 0 },
                bottom: { x: 0, y: 30 },
                left: { x: -25, y: 0 }
            }
        };

        // Hindernisse
        let obstacles = [];
        const obstacleWidth = 30;
        const obstacleHeight = 30;
        const obstacleSpeed = 3;

        // Wolken
        let clouds = [];
        const cloudCount = 5;

        // Initialisiere Wolken
        function initClouds() {
            clouds = [];
            for (let i = 0; i < cloudCount; i++) {
                clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    width: 60 + Math.random() * 40,
                    height: 30 + Math.random() * 20,
                    speed: 1 + Math.random() * 2
                });
            }
        }

        function drawBalloon() {
            // Ballonkorb
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(balloon.x - 10, balloon.y + 40, 20, 20);

            // Ballon
            ctx.beginPath();
            ctx.ellipse(balloon.x, balloon.y, balloon.width / 2, balloon.height / 2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FF0000';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Verbindungslinien
            ctx.beginPath();
            ctx.moveTo(balloon.x - 10, balloon.y + 40);
            ctx.lineTo(balloon.x - 15, balloon.y + 20);
            ctx.moveTo(balloon.x + 10, balloon.y + 40);
            ctx.lineTo(balloon.x + 15, balloon.y + 20);
            ctx.stroke();

            // Hitbox-Debug (nur für Entwicklung)
            if (false) { // Auf true setzen um Hitbox zu sehen
                ctx.strokeStyle = 'rgba(255,0,0,0.5)';
                ctx.beginPath();
                ctx.moveTo(balloon.x + balloon.hitbox.top.x, balloon.y + balloon.hitbox.top.y);
                ctx.lineTo(balloon.x + balloon.hitbox.right.x, balloon.y + balloon.hitbox.right.y);
                ctx.lineTo(balloon.x + balloon.hitbox.bottom.x, balloon.y + balloon.hitbox.bottom.y);
                ctx.lineTo(balloon.x + balloon.hitbox.left.x, balloon.y + balloon.hitbox.left.y);
                ctx.closePath();
                ctx.stroke();
            }
        }

        function drawObstacles() {
            ctx.fillStyle = 'red';
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
            });
        }

        function drawClouds() {
            ctx.fillStyle = 'gray';
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.ellipse(cloud.x, cloud.y, cloud.width / 2, cloud.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.y += cloud.speed;
                if (cloud.y > canvas.height) {
                    cloud.y = -cloud.height;
                    cloud.x = Math.random() * canvas.width;
                }
            });
        }

        function createObstacle() {
            if (Math.random() < 0.02) {
                obstacles.push({
                    x: Math.random() * (canvas.width - obstacleWidth),
                    y: -obstacleHeight,
                    width: obstacleWidth,
                    height: obstacleHeight
                });
            }
        }

        function updateObstacles() {
            obstacles = obstacles.filter(obstacle => {
                obstacle.y += obstacleSpeed;
                return obstacle.y < canvas.height;
            });
        }

        function checkCollision() {
            return obstacles.some(obstacle => {
                // Berechne die Eckpunkte des Hindernisses
                const obstacleLeft = obstacle.x;
                const obstacleRight = obstacle.x + obstacle.width;
                const obstacleTop = obstacle.y;
                const obstacleBottom = obstacle.y + obstacle.height;

                // Berechne die Eckpunkte der Ballon-Hitbox
                const balloonLeft = balloon.x + balloon.hitbox.left.x;
                const balloonRight = balloon.x + balloon.hitbox.right.x;
                const balloonTop = balloon.y + balloon.hitbox.top.y;
                const balloonBottom = balloon.y + balloon.hitbox.bottom.y;

                // Prüfe Kollision zwischen Rechteck (Hindernis) und Raute (Ballon)
                return (
                    // Prüfe ob eine Ecke des Hindernisses innerhalb der Ballon-Hitbox liegt
                    (obstacleLeft <= balloonRight && obstacleRight >= balloonLeft &&
                        obstacleTop <= balloonBottom && obstacleBottom >= balloonTop) ||
                    // Prüfe ob eine Ecke der Ballon-Hitbox innerhalb des Hindernisses liegt
                    (balloonLeft <= obstacleRight && balloonRight >= obstacleLeft &&
                        balloonTop <= obstacleBottom && balloonBottom >= obstacleTop)
                );
            });
        }

        function updateScore() {
            score++;
            scoreElement.textContent = score;
        }

        function updateBalloonPosition() {
            if (isTouching) {
                balloon.x = touchX;
            } else if (isMouseDown) {
                balloon.x = mouseX;
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zeichne und aktualisiere Wolken
            drawClouds();
            updateClouds();

            // Zeichne und aktualisiere Hindernisse
            drawObstacles();
            updateObstacles();
            createObstacle();

            // Aktualisiere und zeichne Ballon
            updateBalloonPosition();
            drawBalloon();

            // Kollisionserkennung
            if (checkCollision()) {
                endGame();
                return;
            }

            // Score aktualisieren
            updateScore();

            animationFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameActive) return;
            if (oncestarted) return;

            document.getElementById("statsbar").style.opacity = 1
            document.getElementById("canvaswrap").style.opacity = 1
            document.getElementById("message").style.opacity = 1

            oncestarted = true
            score = 0;
            scoreElement.textContent = score;
            obstacles = [];
            balloon.x = canvas.width / 2;
            gameActive = true;
            message.textContent = isMobileDevice() ? "Berühre den Bildschirm zum Steuern" : "Benutze die Maus zum Steuern";
            initClouds();
            gameLoop();
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationFrame);
            document.getElementById("finalScore").innerText = score
            document.getElementById("gameOver").style.display = "flex"
            document.getElementById("message").innerHTML = ""

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore_heissluftballon', highScore);
                highScoreElement.textContent = highScore;
            }

            document.getElementById("statsbar").style.opacity = 0
            document.getElementById("canvaswrap").style.opacity = 0
            document.getElementById("message").style.opacity = 0
        }

        // Touch-Steuerung
        function handleTouchStart(e) {
            e.preventDefault();
            isTouching = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (e.touches[0].clientX - rect.left) * scaleX;
            touchX = canvasX;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (e.touches[0].clientX - rect.left) * scaleX;
            touchX = Math.max(balloon.width / 2, Math.min(canvas.width - balloon.width / 2, canvasX));
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            isTouching = false;
        }

        // Maus-Steuerung
        function handleMouseDown(e) {
            if (!gameActive) return;
            isMouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (e.clientX - rect.left) * scaleX;
            mouseX = Math.max(balloon.width / 2, Math.min(canvas.width - balloon.width / 2, canvasX));
        }

        function handleMouseMove(e) {
            if (!gameActive || !isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (e.clientX - rect.left) * scaleX;
            mouseX = Math.max(balloon.width / 2, Math.min(canvas.width - balloon.width / 2, canvasX));
        }

        function handleMouseUp() {
            isMouseDown = false;
        }

        // Event-Listener für Touch-Steuerung
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        // Event-Listener für Maus-Steuerung
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('mouseleave', handleMouseUp);

        let jumpedonce = false

        // Initialisiere Highscore
        highScoreElement.textContent = highScore;

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const container = wrapper.parentElement;
            const availableHeight = window.innerHeight - container.offsetTop - 150; // 150px für Header, Stats, Message und Controls
            const availableWidth = container.clientWidth;

            // Berechne die optimale Größe basierend auf dem verfügbaren Platz
            const aspectRatio = 2 / 3;
            let newWidth = availableWidth;
            let newHeight = newWidth * aspectRatio;

            if (newHeight > availableHeight) {
                newHeight = availableHeight;
                newWidth = newHeight / aspectRatio;
            }

            canvas.width = newWidth;
            canvas.height = 600;

            // Aktualisiere die Ballon-Position
            balloon.x = canvas.width / 2;
            balloon.y = canvas.height - 100;
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
    </script>
</body>

</html>
